<!DOCTYPE html>
<html>
<head>
  <title>Tamagotchi Generator</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 50px; background: #f0f0f0; }
    input, button { padding: 10px; font-size: 16px; }
    img { margin-top: 20px; width: 250px; height: auto; }
  </style>
</head>
<body>
  <h1>Tamagotchi Generator</h1>
  <p>Enter your Twitter handle:</p>
  <input id="handle" placeholder="e.g. @untaxxable" />
  <button onclick="generate()">Generate</button>
  <div><img id="output" /></div>
  <p id="prompt"></p>

  <script>
    function generate() {
      let handle = document.getElementById("handle").value.trim().replace(/^@/, "");
      fetch("/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ handle })
      })
      .then(res => res.json())
      .then(data => {
        if (data.image_url) {
          document.getElementById("output").src = data.image_url;
          document.getElementById("prompt").innerText = data.prompt;
        } else {
          alert("Image generation failed.");
          console.log(data);
        }
      })
      .catch(err => {
        console.error(err);
        alert("Something went wrong.");
      });
    }
  </script>
</body>
</html>
